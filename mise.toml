[tools]
bun = "1.3.11"

[tasks.verify]
alias = "vv"
run = '''
# verify
bun install --frozen-lockfile
bun run fmt:check
bun run test
bun run lint
bun run build

# non-empty output assertions
test -s out/index.html
test -s out/en/index.html
test -s out/ko/index.html
test -s out/sitemap.xml
test -s out/robots.txt
test -s out/favicon.svg
test -s out/en/blog.xml
test -s out/ko/blog.xml
test -s out/en/news.xml
test -s out/ko/news.xml
'''
